name: Reference checks and extraction baseline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run workflow and evaluator checks
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic workflow evidence
        run: python demo.py
      - name: Measure the deterministic parser baseline
        run: python evaluate.py
      - name: Show the baseline report
        run: cat artifacts/evaluation/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reproducible evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-evidence-python-${{ matrix.python-version }}
          path: |
            artifacts/run-report.md
            artifacts/run-report.json
            artifacts/evaluation/report.md
            artifacts/evaluation/report.json
            artifacts/evaluation/predictions.jsonl
          if-no-files-found: error
          retention-days: 14
